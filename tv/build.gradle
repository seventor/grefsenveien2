plugins {
    id 'com.android.application'
}

apply from: rootProject.file('gradle/build-config.gradle')

android {
    namespace 'com.pixelspore.grefsenveien.tv'
    compileSdk 35

    defaultConfig {
        applicationId "com.pixelspore.grefsenveien"
        minSdk 24
        targetSdk 35

        def versionCodeOverride = project.findProperty('versionCodeOverride')
        versionCode versionCodeOverride != null ? versionCodeOverride.toInteger() : 17

        def versionNameOverride = project.findProperty('versionNameOverride')
        versionName versionNameOverride != null ? versionNameOverride.toString() : "3.0"

        buildConfigField "String", "GARAGE_WEBHOOK_URL", "\"${getBuildProperty('GARAGE_WEBHOOK_URL')}\""
        buildConfigField "String", "GATE_WEBHOOK_URL", "\"${getBuildProperty('GATE_WEBHOOK_URL')}\""
        buildConfigField "String", "DOORBELL_TAKE_IMAGE_URL", "\"${getBuildProperty('DOORBELL_TAKE_IMAGE_URL')}\""
        buildConfigField "String", "DOORBELL_TAKE_IMAGE_TOKEN", "\"${getBuildProperty('DOORBELL_TAKE_IMAGE_TOKEN')}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file("../app/pixelspore.keystore")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "Grefsenveien Debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.gms:play-services-auth:21.0.0'

    // Align Kotlin stdlib to avoid jdk7/jdk8 duplicate-class clashes with Play Services.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
}
